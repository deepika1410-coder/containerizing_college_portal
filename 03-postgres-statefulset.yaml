# ==============================================================
# DEMO / LOCAL KUBERNETES POSTGRESQL STATEFULSET
# For production environments, point DATABASE_URL to Managed RDS
# ==============================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: campusflow-postgres
  namespace: campusflow
  labels:
    app: campusflow-postgres
spec:
  serviceName: campusflow-postgres
  replicas: 1
  selector:
    matchLabels:
      app: campusflow-postgres
  template:
    metadata:
      labels:
        app: campusflow-postgres
    spec:
      containers:
        - name: postgresql
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: campusflow-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: campusflow-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: campusflow-secrets
                  key: POSTGRES_DB
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: campusflow-postgres
  namespace: campusflow
  labels:
    app: campusflow-postgres
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  clusterIP: None
  selector:
    app: campusflow-postgres
