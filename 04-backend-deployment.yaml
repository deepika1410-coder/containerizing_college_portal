apiVersion: apps/v1
kind: Deployment
metadata:
  name: campusflow-backend
  namespace: campusflow
  labels:
    app: campusflow-backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: campusflow-backend
  template:
    metadata:
      labels:
        app: campusflow-backend
    spec:
      containers:
        - name: backend
          # Immutable tag replaced during CI/CD rollout: e.g. campusflow/backend:v1.0.0-a7d83f
          image: campusflow/backend:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: campusflow-config
            - secretRef:
                name: campusflow-secrets
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 800m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /live
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: campusflow-backend
  namespace: campusflow
  labels:
    app: campusflow-backend
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
      name: http
  selector:
    app: campusflow-backend
