apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: campusflow-ingress
  namespace: campusflow
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/websocket-services: "campusflow-backend"
spec:
  rules:
    - host: portal.campusflow.edu
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: campusflow-backend
                port:
                  number: 5000
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: campusflow-backend
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: campusflow-frontend
                port:
                  number: 80
