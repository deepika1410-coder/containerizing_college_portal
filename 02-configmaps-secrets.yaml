apiVersion: v1
kind: ConfigMap
metadata:
  name: campusflow-config
  namespace: campusflow
data:
  NODE_ENV: "production"
  PORT: "5000"
  DB_PORT: "5432"
  AUTO_SEED: "true"
  JWT_EXPIRES_IN: "24h"
---
apiVersion: v1
kind: Secret
metadata:
  name: campusflow-secrets
  namespace: campusflow
type: Opaque
stringData:
  # In local demo k8s, points to the demo PostgreSQL service
  # In cloud production, replace with managed PostgreSQL connection string (AWS RDS, Supabase, Azure, GCP)
  DATABASE_URL: "postgresql://campusflow:campusflow_secret@campusflow-postgres:5432/campusflow_db"
  JWT_SECRET: "campusflow_prod_k8s_secret_jwt_key_928b089b"
  POSTGRES_USER: "campusflow"
  POSTGRES_PASSWORD: "campusflow_secret"
  POSTGRES_DB: "campusflow_db"
